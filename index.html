<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Simulador de correo — Norteca</title>
<style>
:root{--bg:#f6f8fc;--pn:#fff;--tx:#1f1f1f;--mu:#5f6368;--bd:#e0e3e9;--ac:#0b57d0;--hv:#e9eef6;--ok:#137333;--bad:#c5221f;--wn:#b06000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--pn:#1b1f26;--tx:#e3e3e3;--mu:#9aa0a6;--bd:#2c313a;--ac:#8ab4f8;--hv:#262c36;--ok:#6dd58c;--bad:#f28b82;--wn:#f0a73a}}
:root[data-theme="dark"]{--bg:#111418;--pn:#1b1f26;--tx:#e3e3e3;--mu:#9aa0a6;--bd:#2c313a;--ac:#8ab4f8;--hv:#262c36;--ok:#6dd58c;--bad:#f28b82;--wn:#f0a73a}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px}
header b{color:var(--ac);font-size:16px}input,button{font:inherit;color:inherit}
input{flex:1;min-width:130px;padding:9px 14px;border:0;border-radius:24px;background:var(--hv)}
button{padding:6px 12px;border:1px solid var(--bd);border-radius:18px;background:var(--pn);cursor:pointer}button:hover{background:var(--hv)}
button.p{background:var(--ac);color:var(--pn);border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
#st{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:4px 12px 8px}#st .lb{flex:none;align-self:center;font-weight:600}
.ca{flex:none;min-width:190px;max-width:240px;background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}.ca.inc{border-left-color:var(--bad)}.ca.rec{border-left-color:var(--ok)}.ca.seg{border-left-color:var(--wn)}.ca small{display:block;color:var(--mu)}
#mn{flex:1;display:grid;grid-template-columns:180px 1fr;min-height:0}
#fo{overflow:auto;padding:4px 8px}#pa{overflow:auto;background:var(--pn);border-radius:16px 0 0 0;margin-right:0}
.f{padding:7px 14px;border-radius:0 16px 16px 0;cursor:pointer;display:flex;justify-content:space-between}.f.s{background:var(--hv);font-weight:700}
.r{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--bd);cursor:pointer}.r:hover{background:var(--hv)}.r.u{font-weight:700}.r .nm{width:160px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .sb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .sb span{font-weight:400;color:var(--mu)}.r .tm{flex:none;font-size:12px;color:var(--mu)}
.av{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700}
.tb{display:flex;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--pn)}.tb button{border:0;background:none}.tb .sp{flex:1}
.mv,.doc{padding:14px 20px 30px;max-width:860px}.mv h2{font-weight:400;margin:6px 0 12px}
.sd{display:flex;gap:12px;align-items:center}.sd .w{flex:1}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--hv);color:var(--mu)}
pre{white-space:pre-wrap;font:inherit;margin:14px 0 14px 46px}
.hd,code{font:12px monospace;word-break:break-all}.bx{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:10px 0}details summary{cursor:pointer;color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.neu{color:var(--wn)}.lk{color:var(--ac);text-decoration:underline;cursor:pointer;margin-right:12px}
.att{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;margin:0 8px 8px 46px;cursor:pointer}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0 46px}.pl button{padding:9px 18px}
.doc{font-family:Georgia,serif}.doc h3{text-align:center;margin:0}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#0009;color:#fff;font-size:28px;animation:f 1.1s forwards;z-index:9}@keyframes f{0%{opacity:0}30%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(max-width:760px){#mn{display:block;overflow:auto}#fo{display:flex;overflow-x:auto;padding:0}#fo .f{flex:none;border-radius:16px}.r .nm{width:90px}pre,.att,.pl{margin-left:0}}
</style></head><body><div id="app">
<header><b>✉ Norteca Mail</b><input id="q" placeholder="Buscar en el correo"><span id="wk"></span><button id="th" title="Tema claro/oscuro">🌓 Tema</button><button class="p" id="adv">Avanzar semana ▶</button><button id="rs">Reiniciar</button></header>
<div id="st"></div><div id="mn"><div id="fo"></div><div id="pa"></div></div></div>
<script>
const WD=['5 oct','12 oct','19 oct','26 oct','2 nov','9 nov','16 nov','23 nov','30 nov','7 dic','14 dic','21 dic'],A={r:'Responder',a:'Archivar',p:'Reportar',v:'Verificar por otro medio',i:'Ignorar/eliminar',l:'Seguir enlace (simulado)',d:'Descargar archivo (simulado)'};
const ME='Alex Rivas <alex.rivas@norteca.example>';
const E=[
{id:1,w:1,lv:1,ph:1,fr:'Soporte de Correo',ad:'buzon-alerta@norteca-soporte.example',t:'Tu buzón alcanzó el 98% de capacidad',tm:'Lun 08:51',b:'Hola,\nTu buzón será suspendido en 24 h. Valida tu cuenta hoy para evitar pérdida de mensajes.\n\nEquipo de Soporte',hd:'Return-Path: bounce@mailer-x9.example|SPF: fail|DKIM: none',lk:[['Validar buzón','https://norteca-soporte.example/login?u=alex (formulario de acceso simulado)']],at:[],th:'Sin mensajes previos de este remitente.',ok:'pvi',bad:'lr',fl:'cred',s:'Dominio distinto al corporativo (norteca.example), SPF fail, sin historial, urgencia genérica.',i:'La redacción impecable y el logotipo no demuestran nada.',a:'Reportar y revisar la cuota escribiendo a mano la dirección de la intranet. Evidencia extra: encabezados completos y consulta a TI.',x:'Los avisos de cuota existen de verdad; TI los envía, pero desde ti@norteca.example.'},
{id:2,w:1,lv:2,ph:0,fr:'Raúl Peña (Andina Logística)',ad:'facturacion@andina-log.example',t:'Factura 4471 – periodo septiembre',tm:'Lun 10:20',b:'Alex, adjunto la factura del mes. Vence el día 15 y la cuenta de depósito es la misma de siempre.\n\nSaludos,\nRaúl Peña · Andina Logística',hd:'SPF: pass|DKIM: pass|X-Mailer: Outlook 16',lk:[],at:[['Factura_4471.pdf','PDF · 84 KB · creador: Andina ERP v3 · 2 sep 2026']],th:'14 hilos previos; último hace 5 semanas (factura 4412). Mismo cliente de correo.',ok:'adv',bad:'p',s:'Hilo previo, autenticación válida, metadatos coherentes, sin cambios de procedimiento.',i:'Que traiga un adjunto no es señal por sí mismo.',a:'Archivar/procesar con el flujo habitual. Esta semana conviene fijarte en cómo es "lo normal" de este proveedor.',x:'Reportar es un falso positivo: te cuesta credibilidad con el proveedor y con TI.'},
{id:3,w:1,lv:2,ph:0,fr:'Elena Vega (Dirección)',ad:'elena.vega@norteca.example',t:'Invitación: Revisión de presupuestos (mié 14 oct)',tm:'Lun 12:05',b:'Los espero el miércoles 14 a las 10:00.\nNota: del 19 al 23 estaré en el Foro Industrial de Monterrey con conexión limitada.\n\nElena',hd:'SPF: pass|DKIM: pass|Content-Type: text/calendar',lk:[],at:[['invitacion.ics','Calendario · 1 KB']],th:'Invitaciones previas de Elena cada trimestre.',cal:['Mié 14 oct 10:00 · Revisión de presupuestos','Lun 19 – Vie 23 oct · Elena en Foro de Monterrey (conexión limitada)'],ok:'arl',bad:'p',s:'Remitente real y hilo coherente. Dato clave para después: Elena viajará del 19 al 23.',i:'Nada urgente ni inusual.',a:'Aceptar y archivar. Anotar el viaje: el contexto sirve para evaluar solicitudes futuras.',x:'Un correo "rutinario" puede dar el contexto que desenmascara otro semanas después.'},
{id:4,w:2,lv:3,ph:0,fr:'Seguridad TI',ad:'seguridad@norteca.example',t:'Inicio de sesión inusual en tu cuenta',tm:'Lun 07:40',b:'Detectamos un acceso a tu buzón desde una ubicación inusual a las 03:14. Si no fuiste tú, repórtalo. Los restablecimientos se hacen solo desde la intranet, nunca por enlaces de correo.',hd:'SPF: pass|DKIM: pass',lk:[['Abrir intranet','https://intranet.norteca.example/seguridad']],at:[],th:'Avisos previos de este buzón: 2.',if:'cred',ok:'pvl',bad:'ai',fl:'persist',s:'Dominio corporativo, autenticación válida y coincide con tu clic de la semana pasada.',i:'La urgencia aquí es legítima.',a:'Reportar, cambiar contraseña desde la intranet y pedir revisión de sesiones. Evidencia extra: registro de accesos.',x:'Tras equivocarse, la tentación es ignorar el aviso por vergüenza.'},
{id:5,w:2,lv:3,ph:0,fr:'Elena Vega (Dirección)',ad:'elena.vega@norteca.example',t:'Cambio de horario: revisión movida a 11:30',tm:'Lun 08:15',b:'Alex, por una llamada con el consejo movemos la revisión a las 11:30. Misma sala.',hd:'SPF: pass|DKIM: pass',lk:[],at:[],th:'Misma persona que la invitación del lunes pasado; sin cambios de estilo.',un:'cred',ok:'ar',bad:'p',s:'Remitente, hilo y calendario coinciden; no pide dinero, datos ni enlaces.',i:'"Cambio de horario" suena a anzuelo clásico, pero aquí no hay petición riesgosa.',a:'Actualizar tu calendario. Evidencia extra: la invitación original.',x:'Sospechar de todo también es un error: reportar causa fatiga en seguridad.'},
{id:6,w:2,lv:4,ph:1,fr:'Raúl Peña (Andina Logística)',ad:'facturacion@andina-log.example',t:'Re: Factura 4471 – periodo septiembre',tm:'Mar 02:44',b:'Alex, por una auditoría cambiamos de banco. Favor de pagar la 4471 a la nueva cuenta (000-0000-0000, ficticia). Adjunto carta. Es urgente por cierre de mes.\n\n> Alex, adjunto la factura del mes… (hilo original)',hd:'SPF: pass|DKIM: pass|Reply-To: raul.pena@andina-log-pagos.example|X-Mailer: WebMail (antes: Outlook 16)|Enviado: 02:44',lk:[],at:[['Carta_cambio_cuenta.pdf','PDF · autor "admin" · creado hoy 02:41 · editor web']],th:'Mismo remitente y hilo de la semana pasada; cambia el cliente de correo y el Reply-To.',ok:'vp',bad:'r',fl:'bank',gd:'v5',m:48000,s:'Cuenta comprometida (simulada): pasa SPF/DKIM, pero cambian Reply-To, cliente, hora, y se pide modificar datos de pago por correo.',i:'El hilo real y el tono idéntico generan confianza; autenticación válida no prueba legitimidad.',a:'Llamar al teléfono del contrato (no al del correo) y validar el cambio con la política de proveedores.',x:'Un experto confía en la cadena previa; el engaño vive en la conversación legítima.'},
{id:7,w:3,lv:3,ph:1,fr:'Elena Vega',ad:'e.vega@norteca-corp.example',t:'Gestión rápida (discreta)',tm:'Lun 09:05',b:'Alex, estoy en el foro sin poder llamar. Necesito 5 tarjetas de regalo de $1,000 para clientes, hoy. Te lo reembolso. Envíame los códigos por aquí y no lo comentes.\n\nElena',hd:'SPF: pass (norteca-corp.example)|DKIM: pass|Reply-To: e.vega@norteca-corp.example',lk:[],at:[],th:'Primer correo desde esta dirección; el correo habitual de Elena es elena.vega@norteca.example.',ok:'vp',bad:'r',fl:'gift',m:5000,s:'Contexto: sabías que viaja con conexión limitada; pide dinero y secreto; dominio parecido (norteca-corp).',i:'La firma correcta y la cortesía; SPF pass del dominio del atacante.',a:'Verificar con Elena o su asistente por un canal conocido. Evidencia extra: dirección habitual en el hilo previo.',x:'Con la agenda olvidada, solo el dominio la delataría.'},
{id:8,w:3,lv:5,ph:1,fr:'Marco Ibarra',ad:'marco.ibarra@norteca.example',t:'Re: tu último pedido a Andina – reporte Q3',tm:'Mar 03:40',b:'Alex, aquí el reporte con los datos del pedido a Andina que me pasaste. Habilita las macros para ver las gráficas.',hd:'SPF: pass|DKIM: pass|X-Originating-IP: externa (no corporativa)|Enviado: 03:40',lk:[],at:[['Reporte_Compras_Q3.xlsm','Excel con macros · sin firma · creado por "Alex Rivas" (plantilla copiada)']],th:'Marco nunca escribe de madrugada; no mencionaste ningún pedido.',if:'cred',ok:'vp',bad:'dl',fl:'mal',m:12000,s:'Usa información que solo está en tu buzón; macros sin firma; envío nocturno desde IP externa.',i:'Es un compañero real con dirección interna.',a:'Preguntar a Marco por teléfono/chat. Reportar y no habilitar macros.',x:'Quien ya fue engañado una vez no suele conectar el ataque con aquel clic.'},
{id:9,w:3,lv:3,ph:0,fr:'Marco Ibarra',ad:'marco.ibarra@norteca.example',t:'Reporte de compras Q3',tm:'Mar 10:30',b:'Alex, te dejo el reporte Q3 para tu revisión del jueves.',hd:'SPF: pass|DKIM: pass|X-Originating-IP: interna',lk:[],at:[['Reporte_Compras_Q3.xlsx','Excel sin macros · 120 KB · creado por Marco Ibarra']],th:'Marco te envía reportes cada trimestre.',un:'cred',ok:'ad',bad:'p',s:'Remitente, hora, IP y formato sin macros coinciden con el patrón normal.',i:'Un adjunto de Excel no es una señal por sí mismo.',a:'Abrir con normalidad.',x:'El exceso de sospecha frena el trabajo.'},
{id:10,w:3,lv:6,ph:0,u:1,fr:'Sofía Luna (RR.HH.)',ad:'rrhh@norteca.example',t:'Corrección de nómina: necesitamos tus datos',tm:'Mié 11:00',b:'Por un error de migración debemos corregir tu depósito del día 15. Responde a este correo con foto de tu identificación y tu CLABE (ficticias en este ejercicio).\n\nRR.HH.',hd:'SPF: pass|DKIM: pass|X-Mailer: Outlook 16',lk:[],at:[],th:'RR.HH. siempre usa el portal para trámites de nómina; esta es la primera solicitud por correo.',ok:'v',bad:'r',fl:'pii',s:'Remitente real y autenticado; el problema es el procedimiento: datos sensibles por correo en vez de portal.',i:'La legitimidad del remitente no implica un procedimiento seguro.',a:'Verificar por teléfono/portal y proponer carga segura; avisar de la práctica insegura.',x:'Reportarlo como phishing sería falso positivo; responder tampoco. La respuesta correcta es verificar.'},
{id:11,w:4,lv:6,ph:1,fr:'PaqExpress Avisos',ad:'avisos@paquexpress.example',t:'No pudimos entregar tu paquete PX-88213',tm:'Lun 13:20',b:'Reprograma tu entrega para evitar devolución. Paquete a nombre de "Norteca Compras – A. Rivas".',hd:'SPF: pass|DKIM: pass',lk:[['Reprogramar','https://paquexpress.example/reprog/PX-88213 (simulado)']],at:[],th:'Tienes la OC-2231 (papelería) abierta, sin guía de rastreo registrada.',ok:'vi',bad:'l',fl:'trk',s:'Sin guía registrada no puedes confirmar el envío; la información parcialmente verdadera es plausible.',i:'Que el dominio sea coherente no confirma el envío.',a:'Revisar el rastreo desde el portal de Compras, nunca desde el enlace. Evidencia extra: número de guía.',x:'Es un caso de información insuficiente: lo seguro es no decidir con lo que hay.'},
{id:12,w:4,lv:2,ph:0,fr:'Comité CIII 2027',ad:'info@congreso-ingenieria.example',t:'Llamada a ponencias – límite 13 de noviembre',tm:'Lun 15:00',b:'Estimados colegas, abrimos la recepción de resúmenes para el congreso. Envíelos antes del 13 de noviembre.',hd:'SPF: pass|DKIM: pass|List-Id: red-universitaria.example',lk:[['Enviar resumen','https://congreso-ingenieria.example/ponencias (simulado)']],at:[],th:'Misma lista de la red universitaria; invitación del año pasado (hilo 2025).',cal:['Vie 13 nov · Fecha límite ponencias CIII 2027'],ok:'alv',bad:'p',s:'Historial 2025, lista conocida, autenticación válida, sin petición de credenciales.',i:'El dominio poco común y la fecha límite son normales en eventos académicos.',a:'Verificar en el sitio oficial de la red; archivar.',x:'Si "dominio raro = phishing", fallas aquí.'},
{id:13,w:4,lv:5,ph:0,fr:'Raúl Peña (Andina Logística)',ad:'facturacion@andina-log.example',t:'Pago pendiente de la factura 4471',tm:'Mar 09:10',b:'Alex, no hemos recibido el pago de la 4471 y nuestra cuenta NO cambió. ¿Qué cuenta usaron?',hd:'SPF: pass|DKIM: pass|X-Mailer: Outlook 16',lk:[],at:[],th:'Cliente de correo habitual de Raúl.',if:'bank',ok:'pv',bad:'i',s:'Hilo real: Andina nunca cambió de cuenta; el pago fue a otra persona (consecuencia de la semana 2).',i:'—',a:'Reportar el incidente a Finanzas/TI de inmediato e intentar recuperar el pago.',x:'Ignorar ahora agrava el impacto financiero.'},
{id:14,w:4,lv:5,ph:0,fr:'Raúl Peña (Andina Logística)',ad:'facturacion@andina-log.example',t:'Gracias por verificar',tm:'Mar 09:10',b:'Alex, gracias por la llamada. Confirmamos que el correo del 6 de octubre no fue nuestro: ya cambiamos credenciales. Sigue con la cuenta de siempre.',hd:'SPF: pass|DKIM: pass|X-Mailer: Outlook 16',lk:[],at:[],th:'Cliente de correo habitual de Raúl.',if:'v5',ok:'ar',bad:'p',s:'Mensaje consistente con tu verificación previa.',i:'—',a:'Archivar.',x:'Verificar a tiempo evitó una pérdida: lo seguro tuvo costo bajo.'},
{id:15,w:4,lv:5,ph:1,fr:'NorteDocs',ad:'notificaciones@nortedocs.example',t:'Marco Ibarra compartió "Presupuesto 2027 – borrador"',tm:'Mié 11:45',b:'Marco Ibarra te invitó a ver un documento.',hd:'Return-Path: mail@nortedocs-share.example|SPF: softfail|DKIM: none',lk:[['Abrir documento','https://nortedocs-share.example/d/9Fq2/open (acceso simulado)']],at:[],th:'Marco no mencionó ningún documento. Las notificaciones reales de NorteDocs llegan de nortedocs.example.',ok:'vp',bad:'l',fl:'cred2',s:'Return-Path y URL pertenecen a nortedocs-share, no a nortedocs; autenticación débil.',i:'El nombre de Marco y el título creíble.',a:'Verificar con Marco y abrir NorteDocs desde el marcador.',x:'El ataque combina un nombre real con una notificación casi perfecta.'},
{id:16,w:5,lv:7,ph:0,fr:'Elena Vega (Dirección)',ad:'elena.vega@norteca.example',t:'Cierre de mes: aprobar 3 pagos hoy',tm:'Lun 08:05',b:'Ya regresé. Necesito que apruebes hoy los 3 pagos de la lista (OC-2231, OC-2240, OC-2252) para cerrar octubre.',hd:'SPF: pass|DKIM: pass|X-Mailer: Outlook 16',lk:[],at:[],th:'Elena ya está de regreso; solicitudes similares todos los meses.',ok:'rv',bad:'p',s:'Remitente, hilo y fechas coinciden; la urgencia es la normal del cierre.',i:'Que pida pagos suena a ataque de jefe falso, pero aquí encaja.',a:'Responder tras comprobar las OC en el sistema; verificar si algo no cuadra.',x:'Varias decisiones razonables: responder tras revisar o confirmar. Lo que falla es reportar o ignorar.'},
{id:17,w:5,lv:6,ph:0,fr:'Seguridad TI',ad:'ti@norteca.example',t:'Cambio obligatorio de contraseña antes del viernes',tm:'Mar 10:00',b:'Por política trimestral, cambia tu contraseña desde la intranet antes del viernes.',hd:'SPF: pass|DKIM: pass',lk:[['Ir a intranet','https://intranet.norteca.example/clave (simulado)']],at:[],th:'Mismo aviso trimestral de TI.',ok:'lav',bad:'p',s:'Dominio y procedimiento normales de TI.',i:'Hablar de contraseñas no lo vuelve phishing.',a:'Entrar a la intranet desde el marcador.',x:'Tras tantos fraudes, hay riesgo de ver ataques en todo.'},
{id:18,w:5,lv:2,ph:1,fr:'RR.HH. Bienestar',ad:'bienestar@norteca-people.example',t:'Encuesta de clima: gana un vale de $500',tm:'Mié 09:30',b:'Participa en la encuesta anual y entra al sorteo de un vale. Solo toma 3 minutos; cierra hoy.',hd:'SPF: pass (norteca-people.example)|DKIM: pass',lk:[['Responder encuesta','https://norteca-people.example/encuesta (simulado)']],at:[],th:'RR.HH. publica sus encuestas en la intranet; es la primera vez que este dominio te escribe.',ok:'vpi',bad:'l',fl:'surv',s:'Dominio parecido (norteca-people), primer contacto, recompensa y cierre el mismo día.',i:'Que SPF y DKIM pasen: el atacante controla ese dominio.',a:'Verificar en la intranet si existe la encuesta.',x:'Una encuesta anual es plausible y el premio baja la guardia.'},

 if(d)h+='<div class="bx" style="margin-left:46px"><b class="'+d.o+'">Decisión '+({ok:'segura',bad:'riesgosa',neu:'neutra'})[d.o]+': '+A[d.a]+(d.auto?' (por inacción)':'')+'</b><p><b>Disponible:</b> remitente, encabezados, '+(e.lk.length?'URL, ':'')+(e.at.length?'metadatos, ':'')+'historial.</p><p><b>Señales relevantes:</b> '+e.s+'</p><p><b>Irrelevantes:</b> '+e.i+'</p><p><b>Alternativa más segura / evidencia adicional:</b> '+e.a+'</p><p><b>Por qué un experto podría fallar:</b> '+e.x+'</p></div>';

 return h+'</div>'}
